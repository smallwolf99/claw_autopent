<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全渗透测试报告 - {{ target if target else "未指定目标" }}</title>
    <style>
        /* 极度简化的CSS，专门用于Markdown封面方案 */
        
        /* A4纸基础设置 */
        @page {
            size: A4;
            margin: 2cm 2.5cm 2.5cm 2.5cm;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            line-height: 1.5;
            color: #333;
            font-size: 11pt;
            margin: 0;
            padding: 0;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        /* 基础标题样式 */
        h1 {
            font-size: 24pt;
            color: #2c3e50;
            margin: 1.5em 0 0.5em 0;
            font-weight: 700;
            page-break-after: avoid;
        }
        
        h2 {
            font-size: 20pt;
            color: #2c3e50;
            margin: 1.2em 0 0.5em 0;
            font-weight: 600;
            page-break-after: avoid;
        }
        
        h3 {
            font-size: 16pt;
            color: #2c3e50;
            margin: 1em 0 0.5em 0;
            font-weight: 600;
            page-break-after: avoid;
        }
        
        /* 段落和列表 */
        p {
            margin-bottom: 1em;
        }
        
        ul, ol {
            margin-left: 20px;
            margin-bottom: 1em;
        }
        
        li {
            margin-bottom: 0.5em;
        }
        
        /* 表格 - 极度简化，避免溢出 */
        table {
            width: 100%;
            max-width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
            page-break-inside: avoid;
            font-size: 10pt;
            table-layout: fixed;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        th {
            background-color: #2c3e50;
            color: white;
            padding: 8px;
            text-align: left;
            font-weight: 700;
            border: 1px solid #1a252f;
            font-size: 0.9em;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        td {
            padding: 6px;
            border: 1px solid #ddd;
            word-wrap: break-word;
            overflow-wrap: break-word;
            overflow: hidden;
            font-size: 0.9em;
        }
        
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        /* 代码块 */
        pre {
            background-color: #f8f9fa;
            color: #1a2332;
            padding: 8px;
            border-radius: 4px;
            margin: 1em 0;
            page-break-inside: avoid;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 9pt;
            line-height: 1.3;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }
        
        code {
            background-color: #f0f2f5;
            color: #1a2332;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 9pt;
        }
        
        /* 块引用 */
        blockquote {
            border-left: 4px solid #bdc3c7;
            padding-left: 12px;
            margin: 1em 0;
            color: #7f8c8d;
            font-style: italic;
        }
        
        /* 打印优化 */
        @media print {
            body {
                font-size: 11pt !important;
                line-height: 1.5 !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            h1, h2, h3 {
                page-break-after: avoid;
            }
            
            table, pre, blockquote {
                page-break-inside: avoid;
            }
            
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
        }
        
        /* 屏幕显示优化 */
        @media screen {
            body {
                background-color: #f5f5f5;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 所有内容直接渲染，封面已在Markdown中 -->
    <div class="content">
        {{ content }}
    </div>
    
    <script>
        // 简单的打印优化
        document.addEventListener('DOMContentLoaded', function() {
            // 添加打印前优化
            window.addEventListener('beforeprint', function() {
                console.log('准备打印：Markdown封面方案');
            });
        });
    </script>
</body>
</html>
