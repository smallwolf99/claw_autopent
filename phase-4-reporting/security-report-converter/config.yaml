# 安全报告转换器配置

templates:
  professional: template_professional.html
  simple: template_simple.html
  executive: template_executive.html
  a4_professional: template_a4_professional.html
  simple_body: template_simple_body.html
  technical: template_technical.html

styles:
  professional: style_professional.css
  simple: style_simple.css
  executive: style_executive.css
  a4_professional: style_professional.css
  simple_body: style_professional.css  # 使用相同的样式文件
  technical: style_professional.css  # 暂时使用相同样式

output:
  html_extension: .html
  pdf_extension: .pdf
  default_template: simple_body

metadata:
  default_author: "安全渗透测试专家团队"
  default_organization: "高级安全测试部门"
  confidentiality: "内部使用 - 禁止外传"
  version: "1.0.0"

pdf:
  page_size: A4
  margin_top: "1cm"
  margin_bottom: "1cm"
  margin_left: "1cm"
  margin_right: "1cm"
  enable_forms: false
  enable_javascript: true
  
html:
  minify: false
  embed_css: true
  embed_images: true

logging:
  level: "INFO"
  log_file: "conversion.log"
  max_file_size: "10MB"
  backup_count: 5
