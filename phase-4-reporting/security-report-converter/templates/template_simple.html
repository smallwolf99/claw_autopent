<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "安全扫描报告" }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #007acc;
        }
        
        h1 {
            color: #007acc;
            margin-bottom: 10px;
        }
        
        .meta {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        h2 {
            color: #333;
            border-left: 4px solid #007acc;
            padding-left: 10px;
            margin-top: 30px;
        }
        
        h3 {
            color: #555;
            margin-top: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        
        th {
            background-color: #f2f2f2;
            padding: 10px;
            text-align: left;
            font-weight: bold;
        }
        
        td {
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
        }
        
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: 12px;
            text-align: center;
        }
        
        .risk-high { color: #d32f2f; font-weight: bold; }
        .risk-medium { color: #f57c00; font-weight: bold; }
        .risk-low { color: #388e3c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ title if title else "安全扫描报告" }}</h1>
        <div class="meta">
            生成时间: {{ generation_date }} | 模板: {{ template_name }}
        </div>
    </div>
    
    <div class="content">
        {{ content }}
    </div>
    
    <div class="footer">
        <p>© 2026 安全团队 | 报告生成于 {{ generation_date }}</p>
        <p>本报告为内部文档，请妥善保管</p>
    </div>
</body>
</html>
