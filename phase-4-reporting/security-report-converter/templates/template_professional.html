<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "安全扫描报告" }}</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        /* 页眉 */
        .header {
            border-bottom: 3px solid #2c3e50;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .report-title {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .report-subtitle {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        
        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
        }
        
        .meta-label {
            font-weight: bold;
            margin-right: 5px;
            color: #2c3e50;
        }
        
        /* 内容区域 */
        .content {
            margin-top: 30px;
        }
        
        h1, h2, h3, h4 {
            color: #2c3e50;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        
        h1 {
            font-size: 28px;
            border-left: 5px solid #3498db;
            padding-left: 15px;
        }
        
        h2 {
            font-size: 24px;
            border-left: 4px solid #2ecc71;
            padding-left: 12px;
        }
        
        h3 {
            font-size: 20px;
            border-left: 3px solid #f39c12;
            padding-left: 10px;
        }
        
        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
        
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
        }
        
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        tr:hover {
            background-color: #e9ecef;
        }
        
        /* 风险等级样式 */
        .risk-high {
            color: #e74c3c;
            font-weight: bold;
            background-color: #ffe6e6;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .risk-medium {
            color: #f39c12;
            font-weight: bold;
            background-color: #fff3cd;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .risk-low {
            color: #27ae60;
            font-weight: bold;
            background-color: #d4edda;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .risk-info {
            color: #3498db;
            font-weight: bold;
            background-color: #d6eaf8;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        /* 代码块 */
        pre {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
        }
        
        code {
            background-color: #f8f9fa;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        
        /* 列表样式 */
        ul, ol {
            margin-left: 20px;
            margin-bottom: 15px;
        }
        
        li {
            margin-bottom: 5px;
        }
        
        /* 页脚 */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #7f8c8d;
            font-size: 14px;
            text-align: center;
        }
        
        .footer-note {
            font-style: italic;
            margin-top: 10px;
        }
        
        /* 响应式设计 */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .container {
                box-shadow: none;
                padding: 0;
            }
            
            .no-print {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .report-title {
                font-size: 24px;
            }
            
            .report-subtitle {
                font-size: 16px;
            }
            
            table {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="report-title">{{ title if title else "安全扫描报告" }}</h1>
            <div class="report-subtitle">专业安全评估报告 - {{ generation_date }}</div>
            
            <div class="meta-info">
                <div class="meta-item">
                    <span class="meta-label">生成时间:</span>
                    <span>{{ generation_date }}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">模板版本:</span>
                    <span>{{ template_name }}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">报告状态:</span>
                    <span>正式版本</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">保密等级:</span>
                    <span>内部使用</span>
                </div>
            </div>
        </div>
        
        <div class="content">
            <!-- Markdown内容将在这里渲染 -->
            {{ content }}
        </div>
        
        <div class="footer">
            <p>© 2026 安全渗透测试专家团队 | 本报告仅限授权人员内部使用</p>
            <p class="footer-note">报告生成时间: {{ generation_date }} | 模板: {{ template_name }}</p>
            <p class="footer-note no-print">建议使用Chrome或Edge浏览器查看本报告以获得最佳体验</p>
        </div>
    </div>
    
    <script>
        // 自动处理风险等级样式
        document.addEventListener('DOMContentLoaded', function() {
            // 查找所有风险等级标记并应用样式
            const riskElements = document.querySelectorAll('p, td, li');
            riskElements.forEach(el => {
                const text = el.textContent || el.innerHTML;
                
                // 检查高风险标记
                if (text.includes('🔴') || text.includes('高风险') || text.includes('High')) {
                    el.innerHTML = el.innerHTML.replace('🔴', '<span class="risk-high">🔴 高风险</span>');
                    el.innerHTML = el.innerHTML.replace('高风险', '<span class="risk-high">高风险</span>');
                    el.innerHTML = el.innerHTML.replace('High', '<span class="risk-high">High</span>');
                }
                
                // 检查中风险标记
                if (text.includes('🟡') || text.includes('中风险') || text.includes('Medium')) {
                    el.innerHTML = el.innerHTML.replace('🟡', '<span class="risk-medium">🟡 中风险</span>');
                    el.innerHTML = el.innerHTML.replace('中风险', '<span class="risk-medium">中风险</span>');
                    el.innerHTML = el.innerHTML.replace('Medium', '<span class="risk-medium">Medium</span>');
                }
                
                // 检查低风险标记
                if (text.includes('🟢') || text.includes('低风险') || text.includes('Low')) {
                    el.innerHTML = el.innerHTML.replace('🟢', '<span class="risk-low">🟢 低风险</span>');
                    el.innerHTML = el.innerHTML.replace('低风险', '<span class="risk-low">低风险</span>');
                    el.innerHTML = el.innerHTML.replace('Low', '<span class="risk-low">Low</span>');
                }
                
                // 检查信息类标记
                if (text.includes('ℹ️') || text.includes('信息类') || text.includes('Informational')) {
                    el.innerHTML = el.innerHTML.replace('ℹ️', '<span class="risk-info">ℹ️ 信息类</span>');
                    el.innerHTML = el.innerHTML.replace('信息类', '<span class="risk-info">信息类</span>');
                    el.innerHTML = el.innerHTML.replace('Informational', '<span class="risk-info">Informational</span>');
                }
            });
            
            // 为打印优化
            const style = document.createElement('style');
            style.textContent = `
                @media print {
                    @page { margin: 1cm; }
                    body { font-size: 12pt; }
                    h1 { page-break-before: always; }
                    h2, h3 { page-break-after: avoid; }
                    table { page-break-inside: avoid; }
                    pre { page-break-inside: avoid; }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
