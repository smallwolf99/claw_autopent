# 登录页面和认证测试规则集
# 匹配条件：endpoint.path contains 'login' 或 business_hints.type == 'banking' (银行系统必有登录)
# 执行动作：添加登录安全测试（弱密码、会话管理、验证码绕过等）

rules:
  login_page_detection:
    id: "login_page_detection"
    name: "登录页面检测规则"
    description: "检测登录页面或银行系统（银行系统必有登录）"
    priority: 95
    enabled: true
    conditions:
      - "endpoint.path contains 'login'"
    actions:
      - action: "add_test"
        category: "authentication_security"
        tests:
          - "weak_password_test"
          - "session_management_test"
          - "captcha_bypass_test"
          - "brute_force_protection_test"
          - "account_lockout_test"
        tools:
          - "hydra"
          - "burpsuite"
          - "ffuf"
          - "custom_scripts"
        priority: "high"
        estimated_time: "45m"
        commands:
          - "hydra -L users.txt -P passwords.txt {url}/login http-post-form '/login:username=^USER^&password=^PASS^:F=incorrect'"
          - "python3 login_tester.py -u {url}/login --tests all"
          - "ffuf -u {url}/FUZZ -w /usr/share/wordlists/dirb/common.txt -fs 0"

  authentication_bypass:
    id: "authentication_bypass"
    name: "认证绕过测试规则"
    description: "针对认证机制的绕过测试"
    priority: 90
    enabled: true
    conditions:
      - "endpoint.auth_required == true"
    actions:
      - action: "add_test"
        category: "auth_bypass"
        tests:
          - "parameter_tampering"
          - "cookie_manipulation"
          - "jwt_tampering"
          - "session_fixation"
        tools:
          - "burpsuite"
          - "jwt_tool"
        priority: "critical"
        estimated_time: "30m"
        commands:
          - "python3 auth_bypass_tester.py -u {url} --methods all"
          - "jwt_tool {jwt_token}"

  session_management:
    id: "session_management"
    name: "会话管理测试规则"
    description: "测试会话管理安全性"
    priority: 85
    enabled: true
    conditions:
      - "endpoint.session_based == true"
    actions:
      - action: "add_test"
        category: "session_security"
        tests:
          - "session_timeout_test"
          - "session_invalidation_test"
          - "cookie_flags_test"
          - "concurrent_session_test"
        tools:
          - "burpsuite"
          - "owasp_zap"
        priority: "medium"
        estimated_time: "25m"
        commands:
          - "python3 session_analyzer.py -u {url}"

  banking_authentication:
    id: "banking_authentication"
    name: "银行系统认证测试规则"
    description: "专门针对银行系统的认证增强测试"
    priority: 100
    enabled: true
    conditions:
      - "business.type == 'banking'"
    actions:
      - action: "add_test"
        category: "banking_auth"
        tests:
          - "multi_factor_bypass"
          - "transaction_authentication_bypass"
          - "sms_verification_bypass"
          - "security_question_bypass"
        tools:
          - "burpsuite"
          - "mitmproxy"
        priority: "critical"
        estimated_time: "60m"
        commands:
          - "python3 banking_auth_tester.py -u {url} --profile banking"
          - "mitmproxy -s banking_auth_bypass.py"