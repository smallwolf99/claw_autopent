# Web技术通用规则集
# 包含HTML5、Bootstrap等通用Web技术的安全测试规则

rules:
  html5_security_testing:
    id: "html5_security_testing"
    name: "HTML5安全测试规则"
    description: "针对HTML5特性的安全测试"
    priority: 50
    enabled: true
    conditions:
      - "technology.name == 'HTML5'"
    actions:
      - action: "add_test"
        category: "html5_security"
        tests:
          - "local_storage_test"
          - "web_sockets_test"
          - "web_workers_test"
          - "geolocation_test"
          - "camera_mic_access_test"
        tools:
          - "burpsuite"
          - "custom_scripts"
        priority: "medium"
        estimated_time: "20m"
        commands:
          - "python3 html5_security_tester.py -u {url}"

  bootstrap_security_testing:
    id: "bootstrap_security_testing"
    name: "Bootstrap安全测试规则"
    description: "针对Bootstrap框架的安全测试"
    priority: 45
    enabled: true
    conditions:
      - "technology.name == 'Bootstrap'"
    actions:
      - action: "add_test"
        category: "bootstrap_security"
        tests:
          - "xss_via_bootstrap"
          - "css_injection"
          - "template_injection"
        tools:
          - "nuclei"
          - "burpsuite"
        priority: "low"
        estimated_time: "15m"
        cves:
          - "CVE-2018-14040"
          - "CVE-2018-14041"
          - "CVE-2018-14042"
          - "CVE-2019-8331"
        commands:
          - "nuclei -u {url} -tags bootstrap"
          - "python3 bootstrap_xss_detector.py -u {url}"

  general_web_technology:
    id: "general_web_technology"
    name: "通用Web技术检测"
    description: "通用Web技术栈的检测和分类"
    priority: 30
    enabled: true
    conditions:
      - "technology.name != ''"
    actions:
      - action: "add_test"
        category: "technology_discovery"
        params:
          catalog_technologies: true
          map_to_cve_database: true
        commands:
          - "python3 technology_mapper.py --url {url} --technologies '{technologies}' --db technology_db.json"

  critical_technology_alert:
    id: "critical_technology_alert"
    name: "高危技术告警规则"
    description: "检测到高危技术时发出告警"
    priority: 200
    enabled: true
    conditions:
      - "technology.name in ['Apache Tomcat', 'Apache HTTP Server', 'Spring Framework']"
      - "technology.confidence >= 0.7"
    actions:
      - action: "set_priority"
        category: "alert"
        params:
          alert_level: "critical"
          notification: "检测到高危技术: {technology.name} {technology.version}"
        commands:
          - "echo '⚠️ 检测到高危技术: {technology.name} {technology.version} on {url}' | tee -a alerts.txt"