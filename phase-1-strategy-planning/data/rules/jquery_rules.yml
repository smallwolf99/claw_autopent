# JQuery安全测试规则集
# 匹配条件：technology.name == 'JQuery' AND technology.version.parsed.major == 1
# 执行动作：添加XSS/DOM漏洞测试

rules:
  jquery_xss_testing:
    id: "jquery_xss_testing"
    name: "JQuery XSS测试规则"
    description: "针对JQuery库的XSS和DOM漏洞测试"
    priority: 80
    enabled: true
    conditions:
      - "technology.name == 'JQuery'"
      - "technology.version contains '1.'"  # JQuery 1.x版本有CVE
    actions:
      - action: "add_test"
        category: "xss_testing"
        tests:
          - "jquery_dom_xss"
          - "jquery_prototype_pollution"
          - "selector_injection"
          - "html_method_injection"
        tools:
          - "nuclei"
          - "custom_scripts"
          - "burpsuite"
        priority: "high"
        estimated_time: "30m"
        cves:
          - "CVE-2019-11358"
          - "CVE-2020-11022"
          - "CVE-2020-11023"
          - "CVE-2021-20083"
        commands:
          - "nuclei -u {url} -tags jquery -severity high"
          - "python3 jquery_xss_scanner.py -u {url}"
          - "node dom_xss_detector.js --url {url} --library jquery"

  jquery_version_analysis:
    id: "jquery_version_analysis"
    name: "JQuery版本分析规则"
    description: "分析JQuery特定版本的安全风险"
    priority: 75
    enabled: true
    conditions:
      - "technology.name == 'JQuery'"
      - "technology.version != ''"
    actions:
      - action: "add_test"
        category: "version_analysis"
        params:
          version_check: true
          risk_assessment: "基于technology_db.json的version_risk_matrix"
        commands:
          - "python3 jquery_version_checker.py --url {url} --version '{technology.version}' --db technology_db.json"

  jquery_selector_injection:
    id: "jquery_selector_injection"
    name: "JQuery选择器注入测试"
    description: "测试JQuery选择器注入漏洞"
    priority: 70
    enabled: true
    conditions:
      - "technology.name == 'JQuery'"
    actions:
      - action: "add_test"
        category: "selector_injection"
        tests:
          - "selector_injection_xss"
          - "attribute_selector_injection"
        tools:
          - "burpsuite"
          - "xss_payload_lists"
        priority: "medium"
        estimated_time: "25m"
        commands:
          - "python3 selector_injection_tester.py -u {url} --library jquery"

  jquery_sink_detection:
    id: "jquery_sink_detection"
    name: "JQuery危险函数检测"
    description: "检测JQuery中的危险函数调用"
    priority: 65
    enabled: true
    conditions:
      - "technology.name == 'JQuery'"
    actions:
      - action: "add_test"
        category: "sink_detection"
        tests:
          - "html_method_detection"
          - "append_method_detection"
          - "attr_method_detection"
        tools:
          - "static_analysis"
          - "dynamic_analysis"
        priority: "medium"
        estimated_time: "20m"
        commands:
          - "python3 jquery_sink_analyzer.py -u {url}"

  modern_jquery_security:
    id: "modern_jquery_security"
    name: "现代JQuery安全测试"
    description: "针对新版JQuery（3.x+）的安全测试"
    priority: 60
    enabled: true
    conditions:
      - "technology.name == 'JQuery'"
      - "technology.version matches '^3\\.|^4\\.|^5\\.'"  # JQuery 3.x及以上版本
    actions:
      - action: "add_test"
        category: "modern_jquery"
        tests:
          - "ajax_security_test"
          - "promise_security_test"
          - "event_handler_security"
        tools:
          - "burpsuite"
          - "custom_scripts"
        priority: "low"
        estimated_time: "15m"
        commands:
          - "python3 modern_jquery_tester.py -u {url} --version '{technology.version}'"