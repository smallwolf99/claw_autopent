# 登录页面和认证测试增强规则集
# 扩展自原有authentication_rules.yml，增加更多认证机制和测试场景

rules:
  # 多因素认证（MFA）测试规则
  - id: "multi_factor_authentication_testing"
    name: "多因素认证测试规则"
    description: "多因素认证机制的安全测试"
    priority: 100
    enabled: true
    conditions:
      - "endpoint.auth_methods contains 'mfa'"
      - "business.type == 'banking'"
    actions:
      - action: "add_test"
        category: "mfa_security"
        tests:
          - "sms_verification_bypass"
          - "totp_bypass_test"
          - "push_notification_bypass"
          - "biometric_bypass_test"
          - "backup_code_abuse"
        tools:
          - "burpsuite"
          - "mitmproxy"
          - "custom_scripts"
        priority: "critical"
        estimated_time: "50m"
        mfa_methods:
          - "SMS验证码"
          - "TOTP（Google Authenticator等）"
          - "推送通知"
          - "生物特征"
          - "硬件令牌"
        commands:
          - "python3 mfa_bypass_tester.py -u {url} --methods all"
          - "mitmproxy -s mfa_interceptor.py"

  # OAuth认证安全测试
  - id: "oauth_authentication_security"
    name: "OAuth认证安全测试规则"
    description: "OAuth 2.0/OpenID Connect认证机制安全测试"
    priority: 95
    enabled: true
    conditions:
      - "endpoint.auth_methods contains 'oauth'"
    actions:
      - action: "add_test"
        category: "oauth_security"
        tests:
          - "oauth_redirect_uri_manipulation"
          - "authorization_code_interception"
          - "access_token_leakage"
          - "refresh_token_abuse"
          - "openid_connect_implementation_flaws"
        tools:
          - "burpsuite"
          - "oauth_tester_tools"
        priority: "high"
        estimated_time: "40m"
        oauth_flows:
          - "授权码流程"
          - "隐式流程"
          - "客户端凭证流程"
          - "资源所有者密码凭证流程"
        commands:
          - "python3 oauth_security_tester.py -u {url} --flow authorization_code"
          - "burpsuite oauth_extension_tests"

  # 密码策略测试增强规则
  - id: "password_policy_testing_enhanced"
    name: "密码策略测试增强规则"
    description: "密码策略和密码管理安全测试"
    priority: 90
    enabled: true
    conditions:
      - "endpoint.path contains 'password'"
    actions:
      - action: "add_test"
        category: "password_policy"
        tests:
          - "weak_password_requirements"
          - "password_reuse_policy"
          - "password_change_requirements"
          - "password_reset_mechanism"
          - "password_hinting_security"
        tools:
          - "password_policy_checkers"
          - "custom_scripts"
        priority: "high"
        estimated_time: "30m"
        password_requirements:
          - "最小长度"
          - "字符复杂度"
          - "历史密码检查"
          - "密码过期策略"
        commands:
          - "python3 password_policy_tester.py -u {url} --check all"

  # 会话管理增强测试
  - id: "session_management_enhanced"
    name: "会话管理增强测试规则"
    description: "会话管理和令牌安全的详细测试"
    priority: 85
    enabled: true
    conditions:
      - "endpoint.session_based == true"
    actions:
      - action: "add_test"
        category: "session_security"
        tests:
          - "session_timeout_validation"
          - "concurrent_session_control"
          - "session_invalidation_test"
          - "cookie_security_attributes"
          - "jwt_token_security"
        tools:
          - "burpsuite"
          - "jwt_tool"
        priority: "medium"
        estimated_time: "35m"
        security_checks:
          - "Secure标志"
          - "HttpOnly标志"
          - "SameSite策略"
          - "过期时间设置"
          - "令牌签名验证"
        commands:
          - "python3 session_analyzer.py -u {url} --checks all"
          - "jwt_tool {jwt_token} -t {url}"

  # 账号锁定和暴力破解防护测试
  - id: "account_lockout_bruteforce_testing"
    name: "账号锁定和暴力破解防护测试规则"
    description: "账号锁定机制和暴力破解防护测试"
    priority: 80
    enabled: true
    conditions:
      - "endpoint.path contains 'login'"
    actions:
      - action: "add_test"
        category: "account_lockout"
        tests:
          - "account_lockout_bypass"
          - "rate_limiting_bypass"
          - "username_enumeration"
          - "credential_stuffing_test"
        tools:
          - "hydra"
          - "burpsuite_intruder"
          - "custom_scripts"
        priority: "high"
        estimated_time: "45m"
        bypass_techniques:
          - "IP轮换"
          - "账户轮换"
          - "延迟绕过"
          - "协议级绕过"
        commands:
          - "hydra -L users.txt -P passwords.txt {url}/login http-post-form '/login:username=^USER^&password=^PASS^:F=incorrect' -t 3 -w 10"
          - "python3 account_lockout_tester.py -u {url}"

  # 生物特征认证测试规则
  - id: "biometric_authentication_testing"
    name: "生物特征认证测试规则"
    description: "指纹、面部识别等生物特征认证安全测试"
    priority: 75
    enabled: true
    conditions:
      - "business.type == 'banking'"
      - "endpoint.auth_methods contains 'biometric'"
    actions:
      - action: "add_test"
        category: "biometric_security"
        tests:
          - "biometric_spoofing_test"
          - "biometric_data_storage_test"
          - "fallback_mechanism_security"
          - "liveness_detection_bypass"
        tools:
          - "biometric_spoofing_tools"
          - "custom_scripts"
        priority: "medium"
        estimated_time: "40m"
        biometric_types:
          - "指纹识别"
          - "面部识别"
          - "虹膜识别"
          - "声纹识别"
        commands:
          - "python3 biometric_security_tester.py -u {url} --type fingerprint"
