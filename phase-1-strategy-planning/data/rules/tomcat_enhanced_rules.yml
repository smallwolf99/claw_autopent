# Tomcat CVE增强规则集
# 扩展自原有tomcat_rules.yml，增加更多具体CVE验证和测试场景

rules:
  # Tomcat CVE-2020-9484 特定规则
  - id: "tomcat_cve_2020_9484"
    name: "Tomcat CVE-2020-9484验证规则"
    description: "Tomcat会话持久化RCE漏洞验证（CVE-2020-9484）"
    priority: 100
    enabled: true
    conditions:
      - "technology.name == 'Apache Tomcat'"
      - "technology.version matches '7\\.|8\\.|9\\.'"
    actions:
      - action: "add_test"
        category: "cve_validation"
        tests: 
          - "tomcat_session_persistence_rce"
        tools: 
          - "nuclei"
          - "metasploit"
        priority: "critical"
        estimated_time: "15m"
        cves:
          - "CVE-2020-9484"
        references:
          - "https://nvd.nist.gov/vuln/detail/CVE-2020-9484"
          - "https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-9484"
        commands:
          - "nuclei -u {url} -id CVE-2020-9484"
          - "python3 tomcat_session_rce.py -u {url}"

  # Tomcat CVE-2020-1938 特定规则
  - id: "tomcat_cve_2020_1938"
    name: "Tomcat CVE-2020-1938验证规则"
    description: "Tomcat AJP协议文件包含/读取漏洞验证（CVE-2020-1938）"
    priority: 100
    enabled: true
    conditions:
      - "technology.name == 'Apache Tomcat'"
      - "technology.version matches '7\\.|8\\.|9\\.'"
    actions:
      - action: "add_test"
        category: "cve_validation"
        tests: 
          - "tomcat_ajp_file_inclusion"
        tools: 
          - "nuclei"
          - "ghostcat_scanner"
        priority: "critical"
        estimated_time: "20m"
        cves:
          - "CVE-2020-1938"
        references:
          - "https://nvd.nist.gov/vuln/detail/CVE-2020-1938"
        commands:
          - "nuclei -u {url} -id CVE-2020-1938"
          - "python3 ghostcat_scanner.py -u {url} -p 8009"

  # Tomcat CVE-2017-12617 特定规则
  - id: "tomcat_cve_2017_12617"
    name: "Tomcat CVE-2017-12617验证规则"
    description: "Tomcat PUT方法任意文件上传漏洞验证（CVE-2017-12617）"
    priority: 95
    enabled: true
    conditions:
      - "technology.name == 'Apache Tomcat'"
      - "technology.version matches '7\\.0\\.0|7\\.0\\.1|7\\.0\\.2|7\\.0\\.3|7\\.0\\.4|7\\.0\\.5|7\\.0\\.6|7\\.0\\.7|7\\.0\\.8|7\\.0\\.9|7\\.0\\.10|7\\.0\\.20|7\\.0\\.30|7\\.0\\.40|7\\.0\\.50|7\\.0\\.60|7\\.0\\.70|7\\.0\\.80'"
    actions:
      - action: "add_test"
        category: "cve_validation"
        tests: 
          - "tomcat_put_method_upload"
        tools: 
          - "nuclei"
          - "metasploit"
        priority: "high"
        estimated_time: "15m"
        cves:
          - "CVE-2017-12617"
        commands:
          - "nuclei -u {url} -id CVE-2017-12617"
          - "python3 tomcat_put_upload.py -u {url}"

  # Tomcat Manager界面深入测试
  - id: "tomcat_manager_deep_testing"
    name: "Tomcat Manager界面深入测试规则"
    description: "针对Tomcat Manager界面的详细安全测试"
    priority: 90
    enabled: true
    conditions:
      - "technology.name == 'Apache Tomcat'"
      - "endpoint.path contains 'manager'"
    actions:
      - action: "add_test"
        category: "manager_security"
        tests:
          - "default_credentials_test"
          - "war_deployment_test"
          - "server_status_access"
          - "directory_listing_test"
        tools:
          - "nmap"
          - "hydra"
          - "gobuster"
        priority: "high"
        estimated_time: "45m"
        credentials:
          - "tomcat:tomcat"
          - "admin:admin"
          - "manager:manager"
          - "admin:<空密码>"
        commands:
          - "nmap -p 8080 {ip} --script tomcat*,http*"
          - "hydra -L tomcat_users.txt -P common_passwords.txt {url}/manager/html http-get"
          - "gobuster dir -u {url}/manager -w /usr/share/wordlists/dirb/common.txt"

  # Tomcat版本精确匹配规则
  - id: "tomcat_version_precise"
    name: "Tomcat版本精确匹配规则"
    description: "根据Tomcat精确版本匹配CVE影响范围"
    priority: 85
    enabled: true
    conditions:
      - "technology.name == 'Apache Tomcat'"
      - "technology.version != ''"
    actions:
      - action: "add_test"
        category: "version_specific"
        params:
          version_analysis: true
          risk_assessment: "基于version_risk_matrix进行精确风险评估"
        commands:
          - "python3 tomcat_version_matcher.py --url {url} --tech 'Apache Tomcat' --version '{technology.version}' --db technology_db.json"

  # Tomcat配置安全测试
  - id: "tomcat_config_security"
    name: "Tomcat配置安全测试规则"
    description: "Tomcat默认配置安全性测试"
    priority: 80
    enabled: true
    conditions:
      - "technology.name == 'Apache Tomcat'"
    actions:
      - action: "add_test"
        category: "configuration_security"
        tests:
          - "default_error_pages"
          - "server_banner_leakage"
          - "directory_listing_enabled"
          - "http_methods_exposed"
        tools:
          - "nmap"
          - "whatweb"
        priority: "medium"
        estimated_time: "20m"
        commands:
          - "nmap -p 8080 {ip} --script http-methods,http-headers"
          - "whatweb {url} --no-errors"
