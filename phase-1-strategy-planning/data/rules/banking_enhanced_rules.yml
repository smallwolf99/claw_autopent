# 银行业务逻辑安全测试增强规则集
# 扩展自原有banking_rules.yml，增加更多详细业务逻辑测试用例

rules:
  # 银行转账逻辑深入测试
  - id: "banking_transfer_logic_deep"
    name: "银行转账逻辑深入测试规则"
    description: "银行转账业务的详细逻辑漏洞测试"
    priority: 100
    enabled: true
    conditions:
      - "business.type == 'banking'"
      - "endpoint.path contains 'transfer'"
    actions:
      - action: "add_test"
        category: "transfer_logic"
        tests:
          - "amount_validation_bypass"
          - "negative_amount_transfer"
          - "zero_amount_transfer"
          - "excessive_amount_transfer"
          - "same_account_transfer"
          - "future_dated_transfer"
          - "past_dated_transfer"
        tools:
          - "burpsuite"
          - "postman"
        priority: "critical"
        estimated_time: "60m"
        test_scenarios:
          - "正常转账"
          - "负数金额转账"
          - "零金额转账"
          - "超过余额转账"
          - "相同账户转账"
          - "未来日期转账"
          - "过去日期转账"
        commands:
          - "python3 banking_transfer_tester.py -u {url} --scenarios all"

  # 贷款业务逻辑测试
  - id: "banking_loan_logic_testing"
    name: "银行贷款业务逻辑测试规则"
    description: "银行贷款申请和审批流程逻辑测试"
    priority: 95
    enabled: true
    conditions:
      - "business.type == 'banking'"
      - "endpoint.path contains 'loan'"
    actions:
      - action: "add_test"
        category: "loan_logic"
        tests:
          - "loan_application_bypass"
          - "interest_rate_manipulation"
          - "loan_amount_tampering"
          - "approval_workflow_bypass"
          - "collateral_valuation_manipulation"
        tools:
          - "burpsuite"
          - "custom_scripts"
        priority: "high"
        estimated_time: "45m"
        commands:
          - "python3 banking_loan_tester.py -u {url} --test all"

  # 存款业务逻辑测试
  - id: "banking_deposit_logic_testing"
    name: "银行存款业务逻辑测试规则"
    description: "银行存款和取款业务逻辑测试"
    priority: 90
    enabled: true
    conditions:
      - "business.type == 'banking'"
      - "endpoint.path contains 'deposit'"
    actions:
      - action: "add_test"
        category: "deposit_logic"
        tests:
          - "deposit_amount_tampering"
          - "withdrawal_limit_bypass"
          - "quick_withdrawal_bypass"
          - "deposit_reversal_manipulation"
        tools:
          - "burpsuite"
          - "custom_scripts"
        priority: "high"
        estimated_time: "40m"
        commands:
          - "python3 banking_deposit_tester.py -u {url}"

  # 账户权限测试增强
  - id: "banking_account_permission_enhanced"
    name: "银行账户权限测试增强规则"
    description: "银行账户权限和访问控制增强测试"
    priority: 100
    enabled: true
    conditions:
      - "business.type == 'banking'"
    actions:
      - action: "add_test"
        category: "account_permission"
        tests:
          - "horizontal_privilege_escalation"
          - "vertical_privilege_escalation"
          - "role_based_access_bypass"
          - "multi_user_account_access"
          - "joint_account_permission_test"
        tools:
          - "burpsuite"
          - "sqlmap"
        priority: "critical"
        estimated_time: "50m"
        test_accounts:
          - "普通用户账户"
          - "VIP用户账户"
          - "企业账户"
          - "管理员账户"
        commands:
          - "python3 banking_permission_tester.py -u {url} --role user --target admin"

  # 交易完整性增强测试
  - id: "banking_transaction_integrity_enhanced"
    name: "银行交易完整性增强测试规则"
    description: "银行交易防篡改和重放攻击的增强测试"
    priority: 100
    enabled: true
    conditions:
      - "business.type == 'banking'"
      - "endpoint.path contains 'transaction'"
    actions:
      - action: "add_test"
        category: "transaction_integrity"
        tests:
          - "transaction_id_sequence_prediction"
          - "timestamp_replay_attack"
          - "cryptographic_signature_bypass"
          - "nonce_reuse_attack"
          - "transaction_parameter_tampering"
        tools:
          - "mitmproxy"
          - "burpsuite"
          - "custom_scripts"
        priority: "critical"
        estimated_time: "55m"
        commands:
          - "python3 transaction_integrity_tester.py -u {url} --attack replay"
          - "mitmproxy -s banking_transaction_interceptor.py"

  # 银行合规性测试规则
  - id: "banking_compliance_testing"
    name: "银行合规性测试规则"
    description: "银行系统合规性要求测试（PCI DSS、GDPR等）"
    priority: 85
    enabled: true
    conditions:
      - "business.type == 'banking'"
    actions:
      - action: "add_test"
        category: "compliance"
        tests:
          - "pci_dss_requirements"
          - "gdpr_data_protection"
          - "sox_compliance"
          - "kyc_aml_compliance"
        tools:
          - "compliance_checklists"
          - "security_scanners"
        priority: "medium"
        estimated_time: "75m"
        standards:
          - "PCI DSS v4.0"
          - "GDPR"
          - "SOX"
          - "KYC/AML"
        commands:
          - "python3 banking_compliance_checker.py -u {url} --standard pci_dss"
          - "python3 gdpr_compliance_checker.py -u {url}"
